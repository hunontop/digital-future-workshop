<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML을 MD로</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--sub:#5b6575;--line:#e3e6eb;--accent:#0f7b6c;--warn:#8a4b12;--warnbg:#fff8f0;--warnline:#f0d9bd}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.55}
main{max-width:980px;margin:0 auto;padding:28px 16px 40px}
h1{margin:0 0 4px;font-size:25px;letter-spacing:-.4px}
.lead{margin:0 0 18px;color:var(--sub);font-size:14.5px}
.drop{display:block;background:var(--card);border:2px dashed #b9c2cd;border-radius:14px;padding:30px 20px;text-align:center;transition:border-color .12s,background .12s}
.drop.over{border-color:var(--accent);background:#eef7f4}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.drop p{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7cc5b6;outline-offset:2px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;flex-wrap:wrap}
.pick select{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
#status{margin:14px 0 0;font-size:14px;font-weight:600;min-height:21px}
#out{display:none;margin-top:12px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .size{margin-left:auto;font-size:13px;color:var(--sub)}
textarea{width:100%;height:440px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:13.5px/1.6 Consolas,"Malgun Gothic",monospace;resize:vertical}
.notes{margin:12px 0 0;padding:12px 16px;background:var(--warnbg);border:1px solid var(--warnline);border-radius:12px;font-size:13.5px;color:#5c4631}
.notes b{color:var(--warn)}
.notes ul{margin:4px 0 0;padding-left:20px}
footer{margin-top:22px;color:var(--sub);font-size:12px}
#stage{position:fixed;left:-20000px;top:0;width:1280px;height:900px;border:0;visibility:hidden}
</style>
</head>
<body>
<main>
  <h1>HTML을 MD로</h1>
  <p class="lead">사이트 파일을 마크다운 글로 바꿉니다. AI를 쓰지 않아 한도가 들지 않고, 파일을 서버에 올리지 않습니다.</p>

  <div class="drop" id="drop">
    <b>작업 폴더나 HTML 파일을 여기에 끌어다 놓습니다</b>
    <p>지도 같은 부품 파일까지 읽히도록 폴더째 넣는 것을 권합니다.</p>
    <div class="btns">
      <button type="button" class="btn main" id="pickDir">폴더 고르기</button>
      <button type="button" class="btn" id="pickFile">파일 고르기</button>
    </div>
    <input type="file" id="dirIn" webkitdirectory multiple hidden>
    <input type="file" id="fileIn" multiple accept=".html,.htm,.js,.css" hidden>
  </div>

  <div class="pick" id="pick" hidden>
    <label for="which">바꿀 파일</label>
    <select id="which"></select>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="out">
    <div class="bar">
      <button type="button" class="btn main" id="copy">전체 복사</button>
      <button type="button" class="btn" id="save">MD 파일 내려받기</button>
      <span class="size" id="size"></span>
    </div>
    <textarea id="md" readonly aria-label="변환 결과"></textarea>
    <div class="notes" id="notes"></div>
  </section>

  <footer>만든 사람: 최상훈 · choihunontop@gmail.com</footer>
</main>
<iframe id="stage" title="변환 작업 화면" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>

<script>
const $=id=>document.getElementById(id);
const LOAD_LIMIT=8000, QUIET=500, SETTLE_LIMIT=3500;
const SKIP=new Set(["SCRIPT","STYLE","NOSCRIPT","TEMPLATE","IFRAME","OBJECT","EMBED","HEAD","META","LINK","TITLE","BUTTON","SVG","CANVAS","DATALIST","MAP","AUDIO","VIDEO"]);
const BLOCK=new Set(["ADDRESS","ARTICLE","ASIDE","BLOCKQUOTE","DD","DETAILS","DIV","DL","DT","FIELDSET","FIGCAPTION","FIGURE","FOOTER","FORM","H1","H2","H3","H4","H5","H6","HEADER","HR","LI","MAIN","NAV","OL","P","PRE","SECTION","SUMMARY","TABLE","UL"]);

let files=new Map(), result=null, runId=0;

/* ── 파일 받기 ─────────────────────────────── */
function setFiles(list){
  files=new Map();
  for(const {file,path} of list) files.set(path.replace(/\\/g,"/"),file);
  const pages=[...files.keys()].filter(p=>/\.html?$/i.test(p)).sort((a,b)=>rank(a)-rank(b)||a.length-b.length||a.localeCompare(b));
  if(!pages.length){setStatus("HTML 파일을 찾지 못했습니다. 폴더 안에 .html 파일이 있는지 봐 주세요.");$("pick").hidden=true;$("out").style.display="none";return}
  $("which").innerHTML="";
  for(const p of pages){const o=document.createElement("option");o.value=p;o.textContent=p;$("which").appendChild(o)}
  $("pick").hidden=pages.length<2;
  convert(pages[0]);
}
function rank(p){const n=p.split("/").pop().toLowerCase();return (n==="index.html"||n==="index.htm"?0:1)+p.split("/").length*2}
async function readEntry(entry,prefix,out){
  if(entry.isFile){const file=await new Promise((ok,no)=>entry.file(ok,no));out.push({file,path:prefix+entry.name});return}
  if(!entry.isDirectory)return;
  const reader=entry.createReader();
  for(;;){
    const batch=await new Promise((ok,no)=>reader.readEntries(ok,no));
    if(!batch.length)break;
    for(const e of batch)await readEntry(e,prefix+entry.name+"/",out);
  }
}
const drop=$("drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>e.preventDefault());
drop.addEventListener("drop",async e=>{
  const items=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  try{
    if(items.length){const out=[];for(const it of items)await readEntry(it,"",out);setFiles(out)}
    else setFiles([...e.dataTransfer.files].map(file=>({file,path:file.name})));
  }catch(err){setStatus("파일을 읽지 못했습니다. [폴더 고르기]로 다시 넣어 주세요.")}
});
$("pickDir").onclick=()=>$("dirIn").click();
$("pickFile").onclick=()=>$("fileIn").click();
$("dirIn").onchange=e=>{setFiles([...e.target.files].map(file=>({file,path:file.webkitRelativePath||file.name})));e.target.value=""};
$("fileIn").onchange=e=>{setFiles([...e.target.files].map(file=>({file,path:file.name})));e.target.value=""};
$("which").onchange=e=>convert(e.target.value);

/* ── 부품 파일 잇기 ─────────────────────────── */
function normalize(parts){const out=[];for(const p of parts){if(p===""||p===".")continue;if(p==="..")out.pop();else out.push(p)}return out.join("/")}
function findAsset(ref,pagePath){
  if(!ref||/^(https?:|data:|blob:|mailto:|tel:|#|\/\/)/i.test(ref))return null;
  let clean=ref.split(/[?#]/)[0];
  try{clean=decodeURIComponent(clean)}catch(e){}
  const dir=pagePath.split("/").slice(0,-1);
  const exact=normalize([...dir,...clean.split("/")]);
  if(files.has(exact))return files.get(exact);
  return null;
}
function prepare(text,pagePath){
  const urls=[], missing=[];
  const doc=new DOMParser().parseFromString(text,"text/html");
  const link=(el,attr)=>{
    const ref=el.getAttribute(attr);
    if(!ref||/^(https?:|data:|blob:|mailto:|tel:|#|\/\/)/i.test(ref))return;
    const f=findAsset(ref,pagePath);
    if(f){const u=URL.createObjectURL(f);urls.push(u);el.setAttribute(attr,u)}
    else{if(el.tagName==="SCRIPT")missing.push(ref);el.removeAttribute(attr)}
  };
  doc.querySelectorAll("script[src]").forEach(el=>link(el,"src"));
  doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(el=>link(el,"href"));
  doc.querySelectorAll("img[src]").forEach(el=>{
    const orig=el.getAttribute("src");
    el.setAttribute("data-html2md-src",orig);
    link(el,"src");
  });
  const trap=doc.createElement("script");
  trap.textContent="window.__html2mdErrors=[];addEventListener('error',function(e){if(e.message)__html2mdErrors.push(e.message)});addEventListener('unhandledrejection',function(e){__html2mdErrors.push(String(e.reason))});";
  (doc.head||doc.documentElement).prepend(trap);
  return {html:"<!doctype html>\n"+doc.documentElement.outerHTML,urls,missing};
}

/* ── 페이지 실행 ───────────────────────────── */
function runPage(html){
  return new Promise(resolve=>{
    const frame=$("stage");
    let settled=false;
    const finish=()=>{if(settled)return;settled=true;frame.onload=null;clearTimeout(hard);setTimeout(()=>waitQuiet(frame).then(resolve),200)};
    const hard=setTimeout(finish,LOAD_LIMIT);
    frame.onload=finish;
    frame.srcdoc=html;
  });
}
function waitQuiet(frame){
  return new Promise(resolve=>{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement){resolve();return}
    let timer;
    const done=()=>{obs.disconnect();clearTimeout(timer);clearTimeout(cap);resolve()};
    const obs=new frame.contentWindow.MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(done,QUIET)});
    obs.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});
    timer=setTimeout(done,QUIET);
    const cap=setTimeout(done,SETTLE_LIMIT);
  });
}

/* ── 글자 크기 기준 ────────────────────────── */
function baseSize(doc,win){
  const tally=new Map();
  const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode();n;n=w.nextNode()){
    const t=n.nodeValue.trim();
    if(!t||!n.parentElement||SKIP.has(n.parentElement.tagName.toUpperCase()))continue;
    const size=Math.round(parseFloat(win.getComputedStyle(n.parentElement).fontSize)*2)/2;
    if(size)tally.set(size,(tally.get(size)||0)+t.length);
  }
  let best=16,count=0;
  for(const [s,c] of tally)if(c>count){best=s;count=c}
  return best;
}

/* ── DOM → 마크다운 ────────────────────────── */
function toMarkdown(doc,win){
  const base=baseSize(doc,win);
  const up=el=>el.tagName.toUpperCase();
  const css=el=>win.getComputedStyle(el);
  const hasText=el=>(el.textContent||"").trim().length>0;
  const isInline=el=>{
    const tag=up(el);
    if(BLOCK.has(tag))return false;
    const d=css(el).display;
    if(d==="none")return tag==="SPAN"||tag==="A"||tag==="B"||tag==="STRONG"||tag==="EM"||tag==="I"||tag==="CODE"||tag==="SMALL"||tag==="SUB"||tag==="SUP"||tag==="MARK";
    if(tag==="SPAN"&&/absolute|fixed/.test(css(el).position))return true;
    return d==="inline"||d==="inline-block"||d==="inline-flex";
  };
  const hasBlockChild=el=>[...el.children].some(c=>!SKIP.has(up(c))&&!isInline(c)&&(hasText(c)||up(c)==="TABLE"||up(c)==="HR"));
  const skipEl=el=>{
    if(up(el)==="BUTTON"&&el.getAttribute("aria-pressed")==="true")return false;   // 켜 둔 선택지는 값이다
    if(SKIP.has(up(el)))return true;
    if(el.getAttribute("aria-hidden")==="true")return true;
    if(el.getAttribute("role")==="button"||el.getAttribute("role")==="tab")return true;
    if(el.classList&&el.classList.contains("leaflet-container"))return true;
    return false;
  };
  const esc=s=>s.replace(/([\\`*_[\]])/g,"\\$1");

  function inline(node,ctx={}){
    let out="";
    for(const n of node.childNodes){
      if(n.nodeType===3){out+=esc(n.nodeValue.replace(/\s+/g," "));continue}
      if(n.nodeType!==1||skipEl(n))continue;
      const tag=up(n);
      if(tag==="BR"){out+="  \n";continue}
      if(tag==="IMG"){
        const alt=(n.getAttribute("alt")||"").trim();
        const src=n.getAttribute("data-html2md-src")||n.getAttribute("src")||"";
        if(alt&&/^https?:/i.test(src))out+=`![${esc(alt)}](${src})`;else if(alt)out+=esc(alt);
        continue;
      }
      if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"){const v=formValue(n);if(v)out+=" "+esc(v)+" ";continue}
      const inner=inline(n,ctx);
      if(!inner.trim())continue;
      const pad=(open,close,text)=>{const m=text.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[1]+open+m[2]+close+m[3]};
      if(tag==="A"){
        const href=n.getAttribute("href")||"";
        out+=/^(https?:|mailto:|tel:)/i.test(href)?pad("[",`](${href})`,inner):inner;
      }else if((tag==="STRONG"||tag==="B")&&!ctx.noBold&&!/\*\*/.test(inner))out+=pad("**","**",inner);
      else if((tag==="EM"||tag==="I")&&!/\*/.test(inner))out+=pad("*","*",inner);
      else if(tag==="CODE"||tag==="KBD"||tag==="SAMP")out+=pad("`","`",(n.textContent||"").replace(/`/g,"'").replace(/\s+/g," "));
      else out+=inner;
    }
    return out;
  }
  function formValue(el){
    const tag=up(el);
    if(tag==="SELECT"){const o=el.options[el.selectedIndex];return o?o.textContent.trim():""}
    if(tag==="TEXTAREA")return el.value.trim();
    const type=(el.getAttribute("type")||"text").toLowerCase();
    if(["hidden","range","file","password","button","submit","reset","image","color"].includes(type))return "";
    if(type==="checkbox"||type==="radio")return el.checked?"[선택됨]":"";
    return (el.value||"").trim();
  }
  const clean=s=>s.replace(/[ \t]+\n/g,m=>m.endsWith("  \n")?"  \n":"\n").replace(/[ \t]{2,}(?!\n)/g," ").replace(/^ +/gm,"").trim();
  const oneLine=s=>clean(s).replace(/ *\n */g," ");

  function headingLevel(el,text){
    const s=css(el), size=parseFloat(s.fontSize), weight=parseInt(s.fontWeight,10)||400, ratio=size/base;
    if(text.length>60||/[.!?。]$|니다\.?$/.test(text))return 0;
    if(/^[^\w가-힣]*\d+교시/.test(text))return 3;   // 실습 사이트의 칸 제목
    if(/^[\s\d.,+\-%~·]+|^[\d.,]+\s*\S{0,6}$/.test(text)&&/^[\s\d]/.test(text))return 0;
    if(weight<600&&ratio<1.3)return 0;
    if(ratio>=1.75)return 2;
    if(ratio>=1.3)return 3;
    if(ratio>=1.08&&weight>=600)return 4;
    return 0;
  }
  function tableMd(t){
    const rows=[...t.rows].map(r=>[...r.cells].map(c=>oneLine(inline(c)).replace(/\|/g,"\\|")));
    if(!rows.length)return "";
    const n=Math.max(...rows.map(r=>r.length));
    rows.forEach(r=>{while(r.length<n)r.push("")});
    const line=r=>"| "+r.join(" | ")+" |";
    return [line(rows[0]),line(rows[0].map(()=>"---")),...rows.slice(1).map(line)].join("\n");
  }
  function gridColumns(el){
    const s=css(el);
    if(!/grid/.test(s.display))return 0;
    const cols=s.gridTemplateColumns;
    if(!cols||cols==="none")return 0;
    return cols.trim().split(/\s+/).length;
  }
  function gridTable(el){
    const n=gridColumns(el), cells=[...el.children].filter(c=>!skipEl(c));
    if(n<2||cells.length<n*2||cells.length%n)return "";
    if(cells.slice(0,n).some(c=>!hasText(c)||c.textContent.trim().length>24||(parseInt(css(c).fontWeight,10)||400)<600))return "";
    if(cells.slice(n,n*2).every(c=>(parseInt(css(c).fontWeight,10)||400)>=600))return "";
    const rows=[];
    for(let i=0;i<cells.length;i+=n)rows.push(cells.slice(i,i+n).map(c=>oneLine(inline(c,{noBold:i===0})).replace(/\|/g,"\\|")));
    const line=r=>"| "+r.join(" | ")+" |";
    return [line(rows[0]),line(rows[0].map(()=>"---")),...rows.slice(1).map(line)].join("\n");
  }
  function listMd(list,depth){
    const lines=[]; let i=1;
    for(const li of list.children){
      if(up(li)!=="LI"||skipEl(li))continue;
      const nested=[...li.children].filter(c=>up(c)==="UL"||up(c)==="OL");
      const bare=li.cloneNode(true);
      bare.querySelectorAll("ul,ol").forEach(x=>x.remove());
      const marker=up(list)==="OL"?`${i++}. `:"- ";
      const pad="  ".repeat(depth);
      const hasBlock=[...li.children].some(c=>!nested.includes(c)&&!SKIP.has(up(c))&&!isInline(c)&&hasText(c));
      const text=hasBlock?blocks(li,{skipLists:true}).join(" ").replace(/\n+/g," "):oneLine(inline(bare));
      if(text)lines.push(pad+marker+clean(text));
      for(const sub of nested){const s=listMd(sub,depth+1);if(s)lines.push(s)}
    }
    return lines.join("\n");
  }
  function blocks(el,opt={}){
    const out=[]; let run=null;
    const flush=()=>{
      if(!run)return;
      const box=run; run=null;
      const text=clean(box.join(""));
      if(text&&!/^\[?\s*\]?$/.test(text))out.push(text);
    };
    for(const n of el.childNodes){
      if(n.nodeType===3){
        if(n.nodeValue.trim()||run)(run=run||[]).push(esc(n.nodeValue.replace(/\s+/g," ")));
        continue;
      }
      if(n.nodeType!==1||skipEl(n))continue;
      const tag=up(n);
      if(opt.skipLists&&(tag==="UL"||tag==="OL"))continue;
      if(isInline(n)||tag==="BR"||tag==="IMG"||tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"){
        if(hasBlockChild(n)&&tag!=="BR"&&tag!=="IMG"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(tag)){flush();out.push(...blocks(n));continue}
        (run=run||[]).push(fragment(n));
        continue;
      }
      flush();
      if(/^H[1-6]$/.test(tag)){const t=oneLine(inline(n,{noBold:true}));if(t)out.push("#".repeat(+tag[1])+" "+t);continue}
      if(tag==="TABLE"){const t=tableMd(n);if(t)out.push(t);continue}
      if(tag==="UL"||tag==="OL"){const t=listMd(n,0);if(t)out.push(t);continue}
      if(tag==="HR"){out.push("---");continue}
      if(tag==="PRE"){out.push("```\n"+(n.textContent||"").replace(/\s+$/,"")+"\n```");continue}
      if(tag==="BLOCKQUOTE"){const inner=blocks(n).join("\n\n");if(inner)out.push(inner.split("\n").map(l=>"> "+l).join("\n"));continue}
      if(tag==="SUMMARY"){const t=oneLine(inline(n,{noBold:true}));if(t)out.push("**"+t+"**");continue}
      if(tag==="LABEL"){const t=oneLine(inline(n));if(t)out.push(t);continue}
      const gt=gridTable(n);
      if(gt){out.push(gt);continue}
      const pair=labelPair(n);
      if(pair){out.push(pair);continue}
      const row=rowLine(n);
      if(row){out.push(row);continue}
      if(!hasBlockChild(n)){
        if(!hasText(n)&&!n.querySelector("input,select,textarea,img"))continue;
        if(hasText(n)&&!/[\w가-힣]/.test(n.textContent))continue;   // 이모지만 있는 칸
        const raw=oneLineKeepBreak(n);
        const plain=oneLine(inline(n,{noBold:true}));
        const lv=headingLevel(n,n.textContent.trim().replace(/\s+/g," "));
        if(lv&&plain){out.push("#".repeat(lv)+" "+plain);continue}
        const s=css(n);
        const bold=(parseInt(s.fontWeight,10)||400)>=600&&plain.length<=60&&!/\*\*/.test(plain)&&plain;
        out.push(bold?"**"+plain+"**":raw);
        continue;
      }
      out.push(...blocks(n));
    }
    flush();
    return out.filter(Boolean);
  }
  function fragment(n){return inline({childNodes:[n]})}
  function oneLineKeepBreak(n){return clean(inline(n)).replace(/\n{2,}/g,"\n")}
  /* 가로로 놓인 짧은 칸(이름 · 숫자)은 줄을 나누지 않고 한 줄로 */
  function rowLine(el){
    const s=css(el);
    const flexRow=/flex/.test(s.display)&&!/column/.test(s.flexDirection)&&s.flexWrap!=="wrap";
    if(!flexRow&&gridColumns(el)<2)return "";
    const cells=[...el.children].filter(c=>!skipEl(c)&&hasText(c));
    if(cells.length<2||cells.length>5||cells.length!==[...el.children].filter(c=>!skipEl(c)&&hasText(c)&&!hasBlockChild(c)).length)return "";
    const texts=cells.map(c=>oneLine(inline(c,{noBold:true})));
    if(texts.some(t=>!t||t.length>40))return "";
    return texts.length===2?`${texts[0]}: ${texts[1]}`:texts.join(" · ");
  }
  /* 라벨 다음에 입력칸이 오면 「라벨: 값」 한 줄로 */
  function labelPair(el){
    const kids=[...el.children].filter(c=>!skipEl(c));
    if(kids.length<2)return "";
    const head=kids[0];
    if(up(head)!=="LABEL"&&!head.classList.contains("lab"))return "";
    const controls=el.querySelectorAll("input,select,textarea");
    if(!controls.length)return "";
    const values=[...controls].map(c=>c.closest("label")===head?"":formValue(c)).filter(Boolean);
    if(!values.length)return "";
    const unit=[...el.querySelectorAll("span")].filter(x=>!x.children.length&&x.textContent.trim().length<=6&&x!==head).map(x=>x.textContent.trim());
    const heading=[...head.childNodes].filter(x=>x.nodeType===3).map(x=>x.nodeValue).join(" ");
    return `${esc(heading.replace(/\s+/g," ").trim())}: ${esc(values.join(", "))}${unit.length?" "+esc(unit.join(" ")):""}`;
  }

  return blocks(doc.body).join("\n\n");
}
function tidy(md,title){
  let body=md.replace(/\n{3,}/g,"\n\n").trim();
  const lines=body.split("\n"), out=[];
  for(const l of lines){
    if(l.trim()&&out.length>=2&&out[out.length-1]===""&&out[out.length-2]===l&&/^#+ |^\*\*/.test(l))continue;
    out.push(l);
  }
  body=out.join("\n");
  if(title&&!/^# /m.test(body))body=`# ${title}\n\n${body}`;
  return body+"\n";
}

/* ── 변환 ──────────────────────────────────── */
function setStatus(t){$("status").textContent=t}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB";
async function convert(path){
  const id=++runId;
  $("out").style.display="none";
  setStatus("페이지를 열어 글을 모으고 있습니다…");
  const file=files.get(path);
  const text=await file.text();
  const {html,urls,missing}=prepare(text,path);
  await runPage(html);
  if(id!==runId){urls.forEach(u=>URL.revokeObjectURL(u));return}
  const frame=$("stage"), doc=frame.contentDocument, win=frame.contentWindow;
  let md="";
  try{
    md=tidy(toMarkdown(doc,win),(doc.title||"").trim());
  }catch(err){
    setStatus("변환하지 못했습니다: "+err.message);
    urls.forEach(u=>URL.revokeObjectURL(u));
    return;
  }
  const svgN=doc.querySelectorAll("svg,canvas").length;
  const leaflet=doc.querySelectorAll(".leaflet-container").length;
  const errs=(win.__html2mdErrors||[]).slice();
  urls.forEach(u=>URL.revokeObjectURL(u));
  const name=path.split("/").pop().replace(/\.html?$/i,"")+".md";
  const bytes=new Blob([md]).size;
  result={md,name};
  $("md").value=md;
  $("size").textContent=`${kb(file.size)} → ${kb(bytes)}`;
  const notes=[];
  if(missing.length)notes.push(`<li><b>부품 파일을 찾지 못했습니다:</b> ${missing.map(h).join(", ")}. 내용이 빠졌을 수 있으니 [폴더 고르기]로 폴더째 넣어 주세요.</li>`);
  if(errs.length)notes.push(`<li><b>페이지 실행 중 오류가 ${errs.length}건 났습니다.</b> 일부 칸이 비어 있을 수 있으니 결과를 사이트와 대조해 주세요.</li>`);
  if(svgN||leaflet)notes.push("<li>지도와 그래프는 그림이라 뺐습니다. 표나 글로 적힌 숫자만 남습니다.</li>");
  notes.push("<li>눌러야 나오는 결과(검색 결과, 지도를 눌러 나오는 설명 등)는 들어가지 않습니다.</li>");
  notes.push("<li>단추와 복사 버튼은 뺐습니다. 제목은 글자 크기로 짐작한 곳이 있으니 필요하면 고쳐 주세요.</li>");
  $("notes").innerHTML="<b>결과에서 볼 것</b><ul>"+notes.join("")+"</ul>";
  $("out").style.display="block";
  setStatus(md.trim()?`변환했습니다: ${path}`:"글을 찾지 못했습니다. 다른 파일을 넣어 주세요.");
  frame.removeAttribute("srcdoc");
  frame.src="about:blank";
}
const h=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("copy").onclick=async()=>{
  const btn=$("copy");
  try{await navigator.clipboard.writeText($("md").value)}
  catch(e){$("md").select();document.execCommand("copy")}
  btn.textContent="✅ 복사했습니다";
  setTimeout(()=>{btn.textContent="전체 복사"},1800);
};
$("save").onclick=()=>{
  if(!result)return;
  const u=URL.createObjectURL(new Blob([result.md],{type:"text/markdown;charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download=result.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};
</script>
